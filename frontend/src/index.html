<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>HRIS Cleteci</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Aplica el tema antes de que arranque Angular para evitar el parpadeo (misma lógica que LayoutService).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('hris.theme');
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            window.matchMedia &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
